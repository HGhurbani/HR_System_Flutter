workflows:
  ios-release:
    name: iOS Release
    environment:
      # pdfrx 2.2.24 / pdfrx_engine 0.3.9 target Flutter 3.35.x (Dart 3.9).
      # Pin the toolchain so a moving stable channel cannot break iOS archives.
      flutter: 3.35.3
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.athar.hr

    integrations:
      app_store_connect: HR

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod repo update
          pod install
          cd ..

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
